<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Litera Line</title>

    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">LITERA<span>LINE</span></div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Explore</a>
            <a href="#" class="active">Profile</a>
        </nav>
    </header>


    <!-- PROFILE -->
    <main class="profile-container">

        <section class="profile-card">

            <!-- FOTO -->
            <div class="profile-photo">
                <img src="https://i.pinimg.com/736x/7e/9d/4e/7e9d4e7a4c5f5b8b8d9f5c6c4f3e4a1e.jpg"
                     alt="Profile Picture">
            </div>

            <!-- INFORMASI USER -->
            <div class="profile-info">

                <h1>Hasna Nailah</h1>

                <p class="username">@nailareads</p>

                <p class="bio">
                    ✦ A reader who finds a little piece of herself
                    in every story. 📖
                </p>

                <button class="edit-btn">Edit Profile</button>

            </div>

        </section>


        <!-- STATISTIK -->
        <section class="stats">

            <div>
                <h3>24</h3>
                <p>Stories Read</p>
            </div>

            <div>
                <h3>12</h3>
                <p>Liked</p>
            </div>

            <div>
                <h3>8</h3>
                <p>Saved</p>
            </div>

        </section>


        <!-- TABS -->
        <div class="tabs">

            <button class="tab active">Liked Stories</button>
            <button class="tab">Saved Stories</button>
            <button class="tab">Continue Reading</button>

        </div>


        <!-- STORY CARDS -->
        <section class="stories">

            <div class="story-card">

                <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f"
                     alt="Book">

                <div class="story-info">
                    <h3>Letters From The Past</h3>
                    <p>Romance • Teen Fiction</p>
                </div>

            </div>


            <div class="story-card">

                <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794"
                     alt="Book">

                <div class="story-info">
                    <h3>When The Stars Speak</h3>
                    <p>Fantasy • Romance</p>
                </div>

            </div>


            <div class="story-card">

                <img src="https://images.unsplash.com/photo-1543002588-bfa74002ed7e"
                     alt="Book">

                <div class="story-info">
                    <h3>Our Last Summer</h3>
                    <p>Drama • Teen Fiction</p>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
